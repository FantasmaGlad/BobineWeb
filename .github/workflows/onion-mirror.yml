name: Onion mirror

# Construit l'export statique du site pour le miroir Tor (.onion) et le publie
# sur la branche orpheline `onion-site`. La machine hôte du service onion tire
# cette branche (git fetch, deploy/onion/sync.sh) : aucun accès entrant vers elle
# n'est nécessaire. Le nom du workflow est repris par `live-tor.yml` (workflow_run).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "security/**"
      - "**/*.md"
  schedule:
    # Rafraîchit chaque jour les données lues sur GitHub Releases (blog, version).
    - cron: "17 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    # À déclencher depuis le dépôt Bobine à chaque release.
    types: [bobine-release]

permissions:
  contents: write

concurrency:
  group: onion-mirror
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Retire les routes serveur et le proxy (copie de travail jetable du runner),
      # puis exporte en statique avec NEXT_PUBLIC_BOBINE_ONION=1.
      - name: Export statique
        run: npm run build:onion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contrôle du miroir
        run: bash scripts/ci/verify-onion.sh out

      # Vercel construit chaque branche poussée : la branche onion-site ne contient que des fichiers statiques
      # (pas d'application Next.js) et son build échouait. Ce vercel.json lui interdit tout déploiement.
      # (sync.sh le retire de la copie servie sur le miroir.)
      - name: Interdire le déploiement Vercel de la branche du miroir
        run: |
          echo '{"git":{"deploymentEnabled":false}}' > out/vercel.json

      - name: Horodater l'export
        run: |
          {
            echo "source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > out/mirror-info.txt

      # Manifeste SHA-256 de tous les fichiers, signé par une clé dédiée au miroir (jamais la clé des paquets). La machine
      # hôte n'accepte que l'empreinte qu'elle a installée elle-même (deploy/onion/README.md). Sans le secret, le
      # miroir reste publié non signé et la machine qui n'exige pas encore de signature continue de fonctionner.
      - name: Signer le miroir
        run: |
          set -eu
          if [ -z "$ONION_SIGNING_KEY" ]; then
            echo "::warning::ONION_SIGNING_KEY absent : miroir publié sans signature"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$ONION_SIGNING_KEY" | gpg --batch --quiet --import
          python3 deploy/onion/site-signature.py manifest out
          gpg --batch --pinentry-mode loopback --passphrase '' --armor --detach-sign -o out/SHA256SUMS.asc out/SHA256SUMS
          rm -rf "$GNUPGHOME"
        env:
          ONION_SIGNING_KEY: ${{ secrets.ONION_SIGNING_KEY }}

      - name: Publier sur la branche onion-site
        run: |
          set -eu
          cd out
          git init -q -b onion-site
          git config user.name "fanta"
          git config user.email "193235053+FantasmaGlad@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(onion): miroir statique ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" onion-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
