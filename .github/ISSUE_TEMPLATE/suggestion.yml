name: Suggestion
description: Une idée pour le contenu, le design ou la structure du site.
labels: ["suggestion"]
body:
  - type: textarea
    id: idee
    attributes:
      label: Votre idée
      description: Ce qui manque ou pourrait être mieux, et pour qui.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
    validations:
      required: false
