# Deux services onion v3 : le depot APT et le site. A ajouter a /etc/tor/torrc.
# Chaque HiddenServiceDir contient la cle secrete du service : la sauvegarder
# hors ligne, la perdre revient a perdre l'adresse .onion.

HiddenServiceDir /var/lib/tor/bobine-apt/
HiddenServiceVersion 3
HiddenServicePort 80 unix:/run/onion/apt.sock
HiddenServicePoWDefensesEnabled 1
HiddenServiceEnableIntroDoSDefense 1

HiddenServiceDir /var/lib/tor/bobine-site/
HiddenServiceVersion 3
HiddenServicePort 80 unix:/run/onion/site.sock
HiddenServicePoWDefensesEnabled 1
HiddenServiceEnableIntroDoSDefense 1
