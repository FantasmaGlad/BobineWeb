name: Prévisualisation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: previsualisation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Prévisualisation
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: deploy
        uses: ./.github/actions/deploy-vercel
        with:
          target: preview
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ vars.VERCEL_TEAM_ID }}
          project-id: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Commenter l'adresse
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Prévisualisation : $URL"
