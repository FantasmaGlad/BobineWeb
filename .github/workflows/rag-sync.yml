name: Synchronisation documentaire

on:
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'src/lib/productFacts.ts'
      - 'src/lib/linuxPackages.ts'
      - 'src/lib/rag/**'
      - 'scripts/rag/**'
      - 'package-lock.json'
      - '.github/workflows/rag-sync.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: documentation-distante
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: web
      - uses: actions/checkout@v7
        with:
          repository: FantasmaGlad/Bobine
          ref: main
          path: Bobine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.RAG_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RAG_SYNC_SERVICE_ACCOUNT }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bobine-rag
          key: documentation-${{ runner.os }}-${{ hashFiles('web/scripts/rag/sources.lock.json', 'web/package-lock.json') }}
      - name: Exporter, importer et vérifier les recherches
        run: npm run sync:rag
        working-directory: web
        env:
          BOBINE_SOURCE_DIR: ${{ github.workspace }}/Bobine
