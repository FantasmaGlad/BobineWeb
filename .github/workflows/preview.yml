name: Prévisualisation

# Déploie une prévisualisation pour chaque demande de fusion issue de ce dépôt. Les demandes
# venant d'un fork n'ont accès à aucun secret : elles passent uniquement par la CI.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: previsualisation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Prévisualisation
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: deploy
        uses: ./.github/actions/deploy-vercel
        with:
          target: preview
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ vars.VERCEL_TEAM_ID }}
          project-id: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Commenter l'adresse
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Prévisualisation : $URL"
