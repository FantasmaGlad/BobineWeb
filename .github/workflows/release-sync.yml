name: Cohérence avec les releases Bobine

# Vérifie l’installateur Stable par son digest et les assets des trois canaux.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Contrôler la cohérence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-release-sync.sh
