name: Surveillance du site de sécurité

# Vérifie chaque jour que security.bobine.fit (GitHub Pages, publié depuis ce dépôt) pointe toujours
# vers GitHub Pages, que la clé OpenPGP publiée est la bonne sur tous les canaux et que security.txt
# est valide. Un échec fait échouer l'exécution : GitHub prévient alors le propriétaire du dépôt.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

env:
  EXPECTED_CNAME: "fantasmaglad.github.io."
  SITE: "https://security.bobine.fit"
  MAIN_SITE: "https://bobine.fit"
  REPO_RAW: "https://raw.githubusercontent.com/FantasmaGlad/Bobine/main/docs/security/bobine-security-public-key.asc"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Empreinte attendue (fichier unique du dépôt)
        run: echo "EXPECTED_FPR=$(tr -d '[:space:]' < security/fingerprint.txt)" >> "$GITHUB_ENV"

      - name: Le domaine pointe vers l'infrastructure officielle (GitHub Pages ou Proxy Cloudflare)
        run: |
          set -euo pipefail
          got_cname="$(dig +short CNAME security.bobine.fit @1.1.1.1 | head -n1 || true)"
          echo "CNAME DNS direct : ${got_cname:-<aucun ou aplati par Cloudflare>}"
          if [ -n "$got_cname" ]; then
            if [ "$got_cname" != "$EXPECTED_CNAME" ]; then
              echo "::error::CNAME inattendu pour security.bobine.fit : $got_cname"
              exit 1
            fi
            echo "Validation CNAME GitHub Pages réussie ($got_cname)"
          else
            ips="$(dig +short A security.bobine.fit @1.1.1.1 || true)"
            echo "Adresses IP résolues : $ips"
            [ -n "$ips" ] || { echo "::error::Impossible de résoudre security.bobine.fit"; exit 1; }
            hdr="$(curl -fsSI --max-time 15 "https://security.bobine.fit" | tr -d '\r')"
            if ! grep -qiE 'server: (cloudflare|github\.com)' <<< "$hdr"; then
              echo "::error::Le serveur ne correspond ni à Cloudflare ni à GitHub Pages"
              exit 1
            fi
            echo "Validation de la résolution DNS proxifiée réussie."
          fi

      - name: Ce dépôt publie bien le domaine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cname="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname')"
          echo "domaine publié par ${GITHUB_REPOSITORY} : ${cname:-<aucun>}"
          [ "$cname" = "security.bobine.fit" ] || { echo "::error::le domaine n'est plus servi par ce dépôt : il peut être repris"; exit 1; }

      - name: Le site répond en HTTPS et sert exactement le contenu du dépôt
        run: bash scripts/ci/smoke-security.sh "$SITE"

      - name: Même empreinte sur tous les canaux
        run: |
          set -euo pipefail
          check() {
            fpr="$(curl -fsS --max-time 30 "$2" | gpg --show-keys --with-colons 2>/dev/null | awk -F: '/^fpr/{print $10; exit}')"
            echo "$1 : ${fpr:-<aucune>}"
            [ "$fpr" = "$EXPECTED_FPR" ] || { echo "::error::empreinte différente sur $1"; exit 1; }
          }
          check "security.bobine.fit" "$SITE/security.asc"
          check "bobine.fit" "$MAIN_SITE/.well-known/security.asc"
          check "dépôt Bobine (GitHub)" "$REPO_RAW"
          dns="$(dig +short TXT bobine.fit @1.1.1.1 | tr -d '"' | grep -c "openpgp4fpr:$EXPECTED_FPR" || true)"
          echo "DNS openpgp4fpr : $dns"
          [ "$dns" -ge 1 ] || { echo "::error::enregistrement DNS openpgp4fpr absent ou différent"; exit 1; }

      - name: security.txt signé, valide et loin de son expiration
        run: |
          set -euo pipefail
          curl -fsS "$MAIN_SITE/.well-known/security.asc" | gpg --import 2>/dev/null
          fetch_and_verify() {
            curl -fsS --max-time 30 "$2/.well-known/security.txt" -o "$3"
            out="$(gpg --status-fd 1 --verify "$3" 2>/dev/null || true)"
            grep -q "VALIDSIG $EXPECTED_FPR" <<< "$out" || { echo "::error::signature de $2/.well-known/security.txt invalide"; exit 1; }
            echo "signature valide : $1 ($2)"
          }
          fetch_and_verify "site principal" "$MAIN_SITE" /tmp/security-main.txt
          fetch_and_verify "site dédié" "$SITE" /tmp/security-site.txt
          cmp /tmp/security-main.txt /tmp/security-site.txt \
            || { echo "::error::les deux security.txt diffèrent"; exit 1; }
          expires="$(sed -n 's/^Expires: //p' /tmp/security-main.txt | head -n1)"
          left=$(( ( $(date -u -d "$expires" +%s) - $(date -u +%s) ) / 86400 ))
          echo "security.txt expire dans $left jours ($expires)"
          [ "$left" -ge 30 ] || { echo "::error::security.txt expire dans moins de 30 jours : le renouveler (scripts/security-txt/sign.sh)"; exit 1; }

      - name: La clé OpenPGP n'expire pas dans moins de 90 jours
        run: |
          set -euo pipefail
          exp="$(curl -fsS "$MAIN_SITE/.well-known/security.asc" | gpg --show-keys --with-colons 2>/dev/null | awk -F: '/^pub/{print $7; exit}')"
          left=$(( ( exp - $(date -u +%s) ) / 86400 ))
          echo "la clé expire dans $left jours"
          [ "$left" -ge 90 ] || { echo "::error::la clé OpenPGP expire dans moins de 90 jours : la renouveler"; exit 1; }
