name: Contrôle en direct du miroir Tor

# Interroge le vrai service onion à travers le réseau Tor : ce que les tests statiques ne voient pas
# (machine hôte, service onion, serveur web, synchronisation). Un échec prévient le propriétaire du dépôt.
on:
  schedule:
    - cron: "37 5,17 * * *"
  workflow_run:
    workflows: ["Onion mirror"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-tor
  cancel-in-progress: false

jobs:
  probe:
    name: Sonde Tor
    # Interrupteur : la sonde ne tourne que si la variable TOR_PROBE_ENABLED vaut "true" (machine hôte en ligne).
    if: vars.TOR_PROBE_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Installer Tor et attendre le circuit
        run: |
          set -eu
          sudo apt-get update -qq
          # Le paquet démarre lui-même le service, qui écoute en SOCKS sur 127.0.0.1:9050.
          sudo apt-get install -y -qq tor gnupg
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 20 --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip | grep -q '"IsTor":true'; then
              echo "circuit Tor établi"
              exit 0
            fi
            sleep 5
          done
          sudo journalctl -u tor@default --no-pager | tail -30 || true
          echo "::error::Tor n'a pas établi de circuit"
          exit 1
      - name: Interroger le miroir
        env:
          # Après une publication, la machine hôte tire la nouvelle version au plus tard dans un quart d'heure.
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          ATTEMPTS: ${{ github.event_name == 'workflow_run' && '30' || '4' }}
        run: bash scripts/ci/smoke-onion.sh
