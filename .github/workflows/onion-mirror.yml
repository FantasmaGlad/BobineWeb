name: Onion mirror

# Construit l'export statique du site pour le miroir Tor (.onion) et le publie
# sur la branche orpheline `onion-site`. La machine hôte du service onion tire
# cette branche (git fetch) : aucun accès entrant vers elle n'est nécessaire.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    # Rafraîchit chaque jour les données lues sur GitHub Releases (blog, version).
    - cron: "17 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    # À déclencher depuis le dépôt Bobine à chaque release.
    types: [bobine-release]

permissions:
  contents: write

concurrency:
  group: onion-mirror
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Retire les routes serveur et le proxy (copie de travail jetable du runner),
      # puis exporte en statique avec NEXT_PUBLIC_BOBINE_ONION=1.
      - name: Build static export
        run: npm run build:onion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the mirror is clean
        run: |
          set -eu
          cd out

          test -f fr/index.html || { echo "fr/index.html manquant"; exit 1; }

          # Les routes retirées doivent afficher la page de renvoi.
          for page in fr/materiel fr/materiel/amazon fr/materiel/aliexpress fr/baamix en/materiel en/baamix; do
            grep -q "onion-notice" "$page/index.html" || { echo "Page de renvoi absente : $page"; exit 1; }
          done

          # Aucun lien marchand ni suivi d'affiliation (un simple texte cité dans une note de version reste permis).
          if grep -rIlE "href=\"https?://[^\"]*(amazon\.[a-z.]+|aliexpress\.[a-z.]+)[^\"]*\"" --include=*.html . | grep -q .; then
            echo "Lien marchand trouvé dans le miroir :"
            grep -rIlE "href=\"https?://[^\"]*(amazon\.[a-z.]+|aliexpress\.[a-z.]+)[^\"]*\"" --include=*.html . | head
            exit 1
          fi

          # Aucune ressource externe chargée automatiquement (les simples liens cliquables restent permis).
          EXT='<(script|img|iframe|source|video)[^>]+src="https?://|<link[^>]+rel="(stylesheet|preload|modulepreload|prefetch|icon|manifest)"[^>]+href="https?://'
          if grep -rIhoE "$EXT" --include=*.html . | grep -q .; then
            echo "Ressource externe chargée automatiquement :"
            grep -rIhoE "$EXT" --include=*.html . | sort | uniq -c | head
            exit 1
          fi

          # Aucun outil de mesure d'audience dans les pages (le composant n'est pas monté ; sa chaîne
          # d'URL peut subsister, inerte, dans un chunk JS partagé).
          if grep -rIl "_vercel/insights\|vercel-scripts" --include=*.html . | grep -q .; then
            echo "Mesure d'audience présente dans le miroir"; exit 1
          fi

      - name: Stamp the build
        run: |
          {
            echo "source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > out/mirror-info.txt

      - name: Publish to the onion-site branch
        run: |
          set -eu
          cd out
          git init -q -b onion-site
          git config user.name "fanta"
          git config user.email "193235053+FantasmaGlad@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(onion): miroir statique ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" onion-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
