name: CI

# Contrôles de validation, exécutés sur chaque demande de fusion et appelés par le déploiement :
# rien n'est publié tant que ces contrôles ne sont pas verts. Le job `ci-ok` est le statut
# unique à exiger dans la protection de branche.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    name: Politique du dépôt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Entrées, secrets, emoji, commits poussés
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          range=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          POLICY_RANGE="$range" bash scripts/ci/policy-check.sh
      - name: Commits de la demande de fusion
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git log --format='%B' "origin/${GITHUB_BASE_REF}..HEAD" | grep -iE '^co-authored-by:'; then
            echo "::error::Trailer de co-auteur interdit"
            exit 1
          fi

  web:
    name: Site (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Verre, jetons de style et contraste des 16 thèmes
        run: node scripts/ci/glass-check.mjs
      - name: Icônes de marque (registre, contraste, attribution)
        run: |
          node scripts/ci/check-assets.mjs
          node --test scripts/ci/check-assets.test.mjs
      - name: Plan du site (hiérarchie, hubs, pied de page)
        run: |
          node scripts/ci/check-site-graph.mjs
          node --test scripts/ci/check-site-graph.test.mjs
      - name: Sources et contrats de recherche documentaire
        env:
          BOBINE_SOURCE_DIR: ${{ runner.temp }}/bobine-sources
        run: |
          git clone --depth 1 https://github.com/FantasmaGlad/Bobine.git "$BOBINE_SOURCE_DIR"
          npm run test:rag
      - name: Limite de débit et bornes de /api/chat
        run: node --test scripts/ci/chat-limits.test.mjs
      - name: Cliquet de jetons (tests d’injection)
        run: node --test scripts/ci/style-tokens.test.mjs
      - name: Export des jetons à jour
        run: |
          node scripts/ci/export-tokens.mjs --check
          node scripts/ci/export-site-controls.mjs --check
      - name: Installer Stable depuis la source canonique
        run: node scripts/ci/sync-install.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Vérification de l’installateur et des corruptions
        run: node --test scripts/ci/sync-install.test.mjs
      - name: Versions Stable, tag source et développement
        run: node --test scripts/ci/release-version-policy.test.mjs
      - name: Simulateur d'installation aligné sur les scripts
        run: bash scripts/ci/check-simulator-sync.sh
      - name: Transparence des visuels détourés
        run: node scripts/ci/check-transparent-assets.mjs
      - name: Hôte unique des dépôts Linux
        run: bash scripts/ci/check-package-hosts.sh
      - name: Paquets Linux (conventions, empreinte, logos)
        run: bash scripts/ci/check-linux-packages.sh
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build de production
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verre du CSS construit (Safari)
        run: node scripts/ci/check-built-glass.mjs
      - name: Fils d'Ariane (un seul par page, adresses dans la langue de la page)
        run: node scripts/ci/check-breadcrumbs.mjs
      - name: Comparatifs (parité, sources et structure FR/EN)
        run: |
          node scripts/ci/check-comparisons.mjs
          node scripts/ci/check-marketing.mjs
          node scripts/ci/check-catalog.mjs
          node --test scripts/ci/check-catalog.test.mjs scripts/ci/deployment-origin.test.mjs
      - name: Géométrie mobile et cibles tactiles
        run: |
          npm run start -- --port 3102 > "$RUNNER_TEMP/mobile-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3102/fr > /dev/null && break
            sleep 1
          done
          node scripts/ci/mobile-check.mjs
          node scripts/ci/modal-check.mjs
          node scripts/ci/check-feature-menu.mjs
      - name: Thèmes et navigation du site sécurité
        run: |
          python3 -m http.server 3104 --bind 127.0.0.1 --directory security/site > "$RUNNER_TEMP/security-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3104/fr/ > /dev/null && break
            sleep 1
          done
          node scripts/ci/check-security-menu.mjs

  onion:
    name: Miroir Tor (export statique)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Stable depuis la source canonique
        run: node scripts/ci/sync-install.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: ShellCheck
        run: shellcheck -S error deploy/onion/*.sh public/install-tor.sh public/install.sh scripts/ci/*.sh scripts/security-txt/sign.sh
      - name: Export statique
        run: npm run build:onion
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reprise des erreurs réseau SOCKS (proxy local, sans Tor)
        run: python3 scripts/ci/test-tor-transport.py
      - name: Contrôle du miroir
        run: bash scripts/ci/verify-onion.sh out

  security-site:
    name: Site de sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash scripts/ci/check-security-site.sh

  ci-ok:
    name: ci-ok
    if: always()
    needs: [policy, web, onion, security-site]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les contrôles sont verts
        run: |
          set -eu
          results='${{ join(needs.*.result, ' ') }}'
          echo "résultats : $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::un contrôle a échoué ou a été ignoré ($r)"; exit 1; }
          done
